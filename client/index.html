<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgriNova | Smart Agriculture Marketplace and Decision Support System</title>
    <meta name="description" content="AgriNova connects farmers directly with crop buyers and provides real-time mandi prices, weather alerts, and smart agricultural decision support." />
    
    <!-- Google Fonts: Inter, Manrope, & Noto Sans Gujarati -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Manrope:wght@500;600;700;800&family=Noto+Sans+Gujarati:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Anti-flash script for instant theme initialization -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('agrinova_theme');
          var isDark = saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-agri-bg text-agri-textDark dark:bg-agri-darkBg dark:text-agri-darkText font-sans antialiased min-h-screen selection:bg-agri-primary selection:text-white transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
